[package]
name = "rust-varlap"
version = "0.1.0-alpha.5"
edition = "2024"
description = "Quality control tool for genetic variants"
readme = "README.md"
repository = "https://github.com/jchchiu/rust-varlap"
license = "MIT"
# Keep the published crate under crates.io's 10 MB limit (test_data has a ~15 MB BAM)
exclude = ["test_data/", "docs/", ".github/", ".readthedocs.yaml", "*.code-workspace"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
flate2 = "1.1.9"
rayon = "1.12.0"
rust-htslib = "1.0.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
clippy = "0.0.302"
tempfile = "3.27.0"
